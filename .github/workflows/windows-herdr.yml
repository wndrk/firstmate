name: Windows Herdr

# Native Windows (no WSL) support for Herdr: docs/windows.md.
# One job per backend, each under Git Bash on a windows-latest runner:
#   - herdr-core (backend hc, the core under the Herdr app):
#     bin/fm-windows-hc-probe.sh against real herdr-core and treehouse.
#   - Herdr 1 (backend herdr, herdr.exe): the transport unit tests and
#     bin/fm-windows-herdr-probe.sh against real herdr.exe and Python.

on:
  push:
    paths:
      - '.github/workflows/windows-herdr.yml'
      - '.gitattributes'
      - 'bin/backends/herdr*'
      - 'bin/fm-backend.sh'
      - 'bin/fm-windows-setup.sh'
      - 'bin/windows/**'
      - 'bin/fm-windows-herdr-probe.sh'
      - 'bin/fm-windows-hc-probe.sh'
      - 'bin/fm-windows-proc-lib.sh'
      - 'bin/fm-agent-process-lib.sh'
      - 'bin/backends/hc.sh'
      - 'bin/fm-session-lock-lib.sh'
      - 'tests/fm-backend-herdr-eventwait.test.py'
  pull_request:
    paths:
      - '.github/workflows/windows-herdr.yml'
      - '.gitattributes'
      - 'bin/backends/herdr*'
      - 'bin/fm-backend.sh'
      - 'bin/fm-windows-setup.sh'
      - 'bin/windows/**'
      - 'bin/fm-windows-herdr-probe.sh'
      - 'bin/fm-windows-hc-probe.sh'
      - 'bin/fm-windows-proc-lib.sh'
      - 'bin/fm-agent-process-lib.sh'
      - 'bin/backends/hc.sh'
      - 'bin/fm-session-lock-lib.sh'
      - 'tests/fm-backend-herdr-eventwait.test.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-herdr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-hc:
    name: herdr-core (Herdr app) on native Windows
    runs-on: windows-latest
    # Normal tier: installs plus a bounded probe of about two minutes.
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Install herdr-core, Treehouse, and jq
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          Invoke-RestMethod https://releases.herdr.dev/core/install.ps1 | Invoke-Expression
          Invoke-RestMethod https://kunchenguid.github.io/treehouse/install.ps1 | Invoke-Expression
          choco install jq --no-progress --limit-output -y

          function Add-ToolDir([string]$name, [string[]]$roots) {
            $tool = Get-Command "$name.exe" -ErrorAction SilentlyContinue
            if (-not $tool) {
              foreach ($root in $roots) {
                if (-not $root -or -not (Test-Path $root)) { continue }
                $found = Get-ChildItem -Path $root -Filter "$name.exe" -Recurse -ErrorAction SilentlyContinue |
                  Sort-Object LastWriteTime -Descending | Select-Object -First 1
                if ($found) { $tool = $found; break }
              }
            }
            if (-not $tool) { throw "$name.exe not found after install" }
            $path = if ($tool.PSObject.Properties.Name -contains 'Source') { $tool.Source } else { $tool.FullName }
            Split-Path -Parent $path | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
            "$name -> $path"
          }
          Add-ToolDir herdr-core @("$env:LOCALAPPDATA\Programs\herdr-core")
          Add-ToolDir treehouse @("$env:USERPROFILE\.treehouse", "$env:LOCALAPPDATA", "$env:USERPROFILE\.local")
          Add-ToolDir jq @("$env:ProgramData\chocolatey")

      - name: Install the Herdr app (informational)
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          Invoke-RestMethod https://releases.herdr.dev/app/install.ps1 | Invoke-Expression
          $app = Join-Path $env:LOCALAPPDATA 'Programs\herdr-app'
          if (Test-Path $app) { $app | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8; Get-ChildItem $app | Select-Object -First 20 }

      - name: Apply Firstmate Windows setup for herdr-core
        run: |
          set -u
          bin/fm-windows-setup.sh --backend hc || true
          bin/fm-windows-setup.sh --backend hc --check
          echo '--- herdr-core config'
          cat "$(cygpath -u "$APPDATA")/herdr-core/config.toml"

      - name: End-to-end herdr-core probe
        run: |
          set -u
          # shellcheck source=/dev/null
          . ~/.bashrc
          bin/fm-windows-hc-probe.sh

      - name: Pi primary identity from a real node process
        run: |
          set -u
          # Pi runs on Windows as node.exe on Pi's bundled cli.js; the session
          # lock must recognize that process from its Windows command line and
          # refuse a node process running any other script.
          dir=$(mktemp -d)
          pkg="$dir/node_modules/@earendil-works/pi-coding-agent/dist/bundle"
          mkdir -p "$pkg" "$dir/other"
          printf 'setInterval(() => {}, 1000);\n' > "$pkg/cli.js"
          cp "$pkg/cli.js" "$dir/other/cli.js"
          node "$(cygpath -w "$pkg/cli.js")" & pi=$!
          node "$(cygpath -w "$dir/other/cli.js")" & other=$!
          sleep 3
          pi_win=$(cat "/proc/$pi/winpid")
          other_win=$(cat "/proc/$other/winpid")
          export FM_WIN_CMDLINE_CACHE_DIR="$dir/cache"
          # shellcheck source=/dev/null
          . bin/fm-session-lock-lib.sh
          rc=0
          got=$(FM_PI_PID=$pi_win fm_harness_ancestry_pid) || got=
          echo "Pi engine $pi_win resolved as '$got'"
          [ "$got" = "win:$pi_win" ] || { echo "::error::the Pi engine was not identified"; rc=1; }
          fm_harness_pid_alive "win:$pi_win" || { echo "::error::the Pi engine read as dead"; rc=1; }
          if FM_PI_PID=$other_win fm_harness_ancestry_pid; then
            echo "::error::an unrelated node process was identified as Pi"; rc=1
          fi
          kill "$pi" "$other" 2>/dev/null || true
          exit "$rc"

      - name: Existing hc adapter suite (informational)
        continue-on-error: true
        timeout-minutes: 10
        run: |
          set -u
          # shellcheck source=/dev/null
          . ~/.bashrc
          bash tests/fm-backend-hc.test.sh

  windows-herdr:
    name: Herdr on native Windows
    runs-on: windows-latest
    # Normal tier: installs plus a bounded probe of about two minutes.
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Install Herdr, Treehouse, and jq
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          Invoke-RestMethod https://herdr.dev/install.ps1 | Invoke-Expression
          Invoke-RestMethod https://kunchenguid.github.io/treehouse/install.ps1 | Invoke-Expression
          choco install jq --no-progress --limit-output -y

          function Add-ToolDir([string]$name, [string[]]$roots) {
            $tool = Get-Command "$name.exe" -ErrorAction SilentlyContinue
            if (-not $tool) {
              foreach ($root in $roots) {
                if (-not $root -or -not (Test-Path $root)) { continue }
                $found = Get-ChildItem -Path $root -Filter "$name.exe" -Recurse -ErrorAction SilentlyContinue |
                  Sort-Object LastWriteTime -Descending | Select-Object -First 1
                if ($found) { $tool = $found; break }
              }
            }
            if (-not $tool) { throw "$name.exe not found after install" }
            $path = if ($tool.PSObject.Properties.Name -contains 'Source') { $tool.Source } else { $tool.FullName }
            Split-Path -Parent $path | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
            "$name -> $path"
          }
          Add-ToolDir herdr @("$env:USERPROFILE\.herdr", "$env:LOCALAPPDATA\Programs\Herdr")
          Add-ToolDir treehouse @("$env:USERPROFILE\.treehouse", "$env:LOCALAPPDATA", "$env:USERPROFILE\.local")
          Add-ToolDir jq @("$env:ProgramData\chocolatey")

      - name: Apply Firstmate Windows setup
        run: |
          set -u
          bin/fm-windows-setup.sh --backend herdr || true
          bin/fm-windows-setup.sh --backend herdr --check
          echo '--- herdr config'
          cat "$(cygpath -u "$APPDATA")/herdr/config.toml"

      - name: Windows unit tests
        run: |
          set -eu
          # shellcheck source=/dev/null
          . ~/.bashrc
          python3 tests/fm-backend-herdr-eventwait.test.py -v

      - name: End-to-end Herdr probe
        run: |
          set -u
          # shellcheck source=/dev/null
          . ~/.bashrc
          bin/fm-windows-herdr-probe.sh

      - name: Existing Herdr adapter suite (informational)
        continue-on-error: true
        timeout-minutes: 10
        run: |
          set -u
          # shellcheck source=/dev/null
          . ~/.bashrc
          rc=0
          for t in tests/fm-backend-herdr.test.sh tests/fm-session-lock-windows-consumers.test.sh; do
            echo "::group::$t"
            bash "$t" || { echo "$t exited $?"; rc=1; }
            echo "::endgroup::"
          done
          exit "$rc"
